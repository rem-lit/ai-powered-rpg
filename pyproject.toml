[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mj"
version = "0.1.0"
description = "Jeu de rôle narratif solo avec Claude comme maître du jeu"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mj = "mj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
